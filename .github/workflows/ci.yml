name: CI

# runs pipeline on every push to main or pull request to main 
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    
# jobs to run in pipeline 
jobs:
  check:
    name: Lint & validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript for syntax errors
        run: |
          node --check js/main.js
          node --check js/components.js
          node --check js/gallery.js
          node --check js/library.js

      - name: Validate HTML
        uses: html-validate/html-validate-action@v1
        with:
          pattern: "*.html"
          config: |
            {
              "extends": ["html-validate:recommended"],
              "rules": {
                "no-inline-style": "off",
                "require-sri": "off"
              }
            }