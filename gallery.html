<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Photos from The Housing Assembly's community organising and events across the Western Cape.">
  <meta property="og:title" content="Gallery — The Housing Assembly">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="site-header"></header>

  <main id="main-content">

      <div class="container">

  <script defer src="js/components.js"></script>
