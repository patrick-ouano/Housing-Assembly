<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — The Housing Assembly</title>
  <meta name="description" content="Photos from The Housing Assembly's community organising and events across the Western Cape.">
  <meta property="og:title" content="Gallery — The Housing Assembly">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/logo.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header id="site-header"></header>

  <main id="main-content">
    <section class="page-header">
      <div class="container">
        <h1>Gallery</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery-grid">
          <button class="gallery-grid__item" type="button" data-full="images/gallery-1.jpg">
            <img src="images/gallery-1.jpg" alt="Athlone District Leaders" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-2.jpg">
            <img src="images/gallery-2.jpg" alt="Community gathering" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-3.jpg">
            <img src="images/gallery-3.jpg" alt="Housing Assembly members" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-4.jpg">
            <img src="images/gallery-4.jpg" alt="Community organising" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-5.jpg">
            <img src="images/gallery-5.jpg" alt="Housing Assembly event" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-6.jpg">
            <img src="images/gallery-6.jpg" alt="Members at a meeting" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-7.jpg">
            <img src="images/gallery-7.jpg" alt="Community action" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-8.jpg">
            <img src="images/gallery-8.jpg" alt="Housing Assembly gathering" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-9.jpg">
            <img src="images/gallery-9.jpg" alt="Members organising together" loading="lazy">
          </button>
          <button class="gallery-grid__item" type="button" data-full="images/gallery-10.jpg">
            <img src="images/gallery-10.jpg" alt="Community event" loading="lazy">
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" type="button" aria-label="Close">&times;</button>
    <img class="lightbox__img" id="lightbox-img" alt="">
  </div>

  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
